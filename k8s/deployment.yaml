apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-platform
  namespace: gitops-platform
  labels:
    app: gitops-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: gitops-platform

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: gitops-platform

    spec:
      containers:
        - name: gitops-platform
          image: narinder15/gitops-kubernetes-platform:3d0e2cd9f3f1d15a86b65e842f16325de5597bff
          imagePullPolicy: Always

          ports:
            - containerPort: 5000
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"